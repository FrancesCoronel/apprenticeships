name: PR

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: FrancesCoronel/workflows/.github/workflows/ci-node.yml@v1

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Unit tests with coverage over all of src/. Every file is fully covered,
  # so any new untested code fails the check.
  coverage:
    uses: FrancesCoronel/workflows/.github/workflows/coverage.yml@v1
    with:
      min: 100

  security:
    uses: FrancesCoronel/workflows/.github/workflows/security.yml@v1

  # Zero axe violations (WCAG 2 AA) and Lighthouse 90+ performance,
  # 100 accessibility, best practices and SEO.
  web-quality:
    uses: FrancesCoronel/workflows/.github/workflows/web-quality.yml@v1
    with:
      urls: |
        /
        /acadium

  # Majors auto-merge too: every check, e2e included, has to pass first, so regressions block it
  dependabot:
    needs: [ci, e2e, coverage, security, web-quality]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    uses: FrancesCoronel/workflows/.github/workflows/dependabot-automerge.yml@v1
    with:
      allow-major: true
    permissions:
      contents: write
      pull-requests: write
